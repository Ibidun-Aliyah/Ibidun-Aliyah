name: Study reminders

on:
  schedule:
    # GitHub cron is in UTC. Lagos (WAT) is UTC+1. Odd minutes = less GitHub queue delay.
    - cron: "33 5 * * *"   # 06:33 Lagos: confirm today's classes
    - cron: "13 18 * * *"  # 19:13 Lagos: confirm tomorrow's classes, set alarm, nap
    - cron: "52 21 * * *"  # 22:52 Lagos: wake up, study time
    - cron: "31 0 * * *"   # 01:31 Lagos: quiz, then sleep
  workflow_dispatch:
    inputs:
      slot:
        description: "Which reminder to send now (for testing)"
        type: choice
        options: [evening, wake, late, morning]
        default: evening

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Send reminder
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          REMINDER_EMAIL_TO: ${{ secrets.REMINDER_EMAIL_TO }}
          APP_URL: ${{ vars.APP_URL }}
          EMAIL_SLOTS: ${{ vars.EMAIL_SLOTS }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_SLOT: ${{ inputs.slot }}
        run: |
          case "$SCHEDULE" in
            "33 5 * * *")  SLOT=morning ;;
            "13 18 * * *") SLOT=evening ;;
            "52 21 * * *") SLOT=wake ;;
            "31 0 * * *")  SLOT=late ;;
            *)             SLOT="${INPUT_SLOT:-evening}" ;;
          esac
          python mechlab/reminders/send_reminders.py --slot "$SLOT"
