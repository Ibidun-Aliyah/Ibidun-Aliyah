plugins { id 'com.android.application' }

android {
    namespace 'com.followthrough.bubble'
    compileSdk 34
    defaultConfig {
        applicationId 'com.followthrough.bubble'
        minSdk 30          // AccessibilityService.takeScreenshot needs Android 11+
        targetSdk 34
        versionCode 23
        versionName "5.3"
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.debug }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
